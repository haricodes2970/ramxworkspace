services:
  ramxworkspace:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: ramxworkspace
    environment:
      NEXT_PUBLIC_APP_NAME: RamxWorkspace
      NEXT_PUBLIC_APP_STAGE: production
      NODE_ENV: production
      PORT: 3000
    ports:
      - "3000:3000"
    restart: unless-stopped
    stop_grace_period: 10s
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: ramxworkspace-api
    environment:
      FRONTEND_URL: http://localhost:3000
    ports:
      - "8000:8000"
    restart: unless-stopped
    stop_grace_period: 10s
